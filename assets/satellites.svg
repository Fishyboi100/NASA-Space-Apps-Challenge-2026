<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Illustration: five fire satellites orbiting Earth. Terra and Aqua carry MODIS; S-NPP, NOAA-20 and NOAA-21 carry VIIRS.">
  <defs>
    <radialGradient id="sky" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#3a1608"/><stop offset="0.55" stop-color="#140a06"/><stop offset="1" stop-color="#080504"/></radialGradient>
    <radialGradient id="earth" cx="50%" cy="20%" r="80%"><stop offset="0" stop-color="#2b1a14"/><stop offset="1" stop-color="#0b0706"/></radialGradient>
    <radialGradient id="limb" cx="50%" cy="100%" r="62%"><stop offset="0.86" stop-color="#e2580f" stop-opacity="0"/><stop offset="0.93" stop-color="#ff8a3d" stop-opacity="0.55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="beamV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb07a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb07a" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c4d6" stop-opacity="0.45"/><stop offset="1" stop-color="#c9c4d6" stop-opacity="0"/></linearGradient>
    <g id="sat"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#f2e9df"/><rect x="-38" y="-5" width="24" height="10" rx="1.5" fill="#6d87a8"/><rect x="14" y="-5" width="24" height="10" rx="1.5" fill="#6d87a8"/><path d="M-14 0h5M9 0h5" stroke="#f2e9df" stroke-width="2"/></g>
  </defs>
  <rect width="900" height="700" rx="28" fill="url(#sky)"/>
  <g fill="#f6e7d8" opacity="0.7"><circle cx="80" cy="70" r="1.4"/><circle cx="210" cy="140" r="1"/><circle cx="330" cy="50" r="1.6"/><circle cx="470" cy="110" r="1"/><circle cx="610" cy="60" r="1.3"/><circle cx="760" cy="120" r="1"/><circle cx="840" cy="40" r="1.5"/><circle cx="150" cy="260" r="1"/><circle cx="720" cy="250" r="1.2"/><circle cx="40" cy="190" r="1"/><circle cx="560" cy="200" r="0.9"/></g>
  <circle cx="450" cy="1250" r="820" fill="url(#limb)"/>
  <circle cx="450" cy="1250" r="760" fill="url(#earth)"/>
  <g fill="#ff8a3d"><circle cx="300" cy="560" r="3"/><circle cx="318" cy="572" r="2"/><circle cx="430" cy="530" r="3.5"/><circle cx="448" cy="545" r="2"/><circle cx="520" cy="548" r="2.5"/><circle cx="610" cy="580" r="3"/><circle cx="625" cy="590" r="2"/><circle cx="210" cy="610" r="2.5"/><circle cx="700" cy="620" r="2.5"/><circle cx="380" cy="600" r="2"/></g>
  <g fill="none" stroke="#f2e9df" stroke-opacity="0.18" stroke-width="1.5"><ellipse cx="450" cy="560" rx="440" ry="250"/><ellipse cx="450" cy="590" rx="400" ry="300"/></g>
  <path d="M190 330 L150 560 L250 560 Z" fill="url(#beamM)"/>
  <path d="M330 250 L300 520 L380 520 Z" fill="url(#beamM)"/>
  <path d="M470 220 L395 520 L545 520 Z" fill="url(#beamV)"/>
  <path d="M610 255 L540 540 L690 540 Z" fill="url(#beamV)"/>
  <path d="M735 330 L670 580 L800 580 Z" fill="url(#beamV)"/>
  <g font-family="Barlow, Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <use href="#sat" x="190" y="330"/><text x="190" y="302" fill="#f2e9df">Terra</text><text x="190" y="282" fill="#c9c4d6" font-size="15" font-weight="500">MODIS · 2000</text>
    <use href="#sat" x="330" y="250"/><text x="330" y="222" fill="#f2e9df">Aqua</text><text x="330" y="202" fill="#c9c4d6" font-size="15" font-weight="500">MODIS · 2002</text>
    <use href="#sat" x="470" y="220"/><text x="470" y="192" fill="#f2e9df">S-NPP</text><text x="470" y="172" fill="#ffb07a" font-size="15" font-weight="500">VIIRS · 2012</text>
    <use href="#sat" x="610" y="255"/><text x="610" y="227" fill="#f2e9df">NOAA-20</text><text x="610" y="207" fill="#ffb07a" font-size="15" font-weight="500">VIIRS · 2018</text>
    <use href="#sat" x="735" y="330"/><text x="735" y="302" fill="#f2e9df">NOAA-21</text><text x="735" y="282" fill="#ffb07a" font-size="15" font-weight="500">VIIRS · 2023</text>
  </g>
</svg>
